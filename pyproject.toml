[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fractalmesh-omega-v32007"
version = "0.1.0"
description = "Performance tracker CLI for DeepSeek V4 checklist workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.6.9",
  "bandit>=1.7.9",
]

[project.scripts]
perf-tracker = "perf_tracker.cli:main"

[tool.setuptools]
packages = ["perf_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["perf_tracker", "tests"]
warn_unused_configs = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.bandit]
exclude_dirs = ["tests"]
