name: perf-tracker

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      stale_warning_only:
        description: 'Treat stale-item findings as warnings instead of failures'
        required: false
        default: 'true'

jobs:
  validate-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate tracker schema
        run: python scripts/validate_tracker.py --data tracker/deepseek_v4_perf_tracker.json validate

      - name: Generate tracker outputs
        run: python scripts/generate_tracker_report.py --data tracker/deepseek_v4_perf_tracker.json

      - name: Commit generated status if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status/latest.md docs/status/latest.json docs/status/priorities.md docs/status/priorities.json || true
          if git diff --cached --quiet; then
            echo "status docs unchanged"
          else
            git commit -m "chore: refresh perf-tracker status docs"
            git push
          fi

      - name: Check stale items
        continue-on-error: ${{ github.event_name == 'schedule' || github.event.inputs.stale_warning_only == 'true' }}
        run: python scripts/generate_tracker_report.py --data tracker/deepseek_v4_perf_tracker.json --fail-on-stale
